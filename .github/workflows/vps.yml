name: Linux Cloud SSH - Public Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Install SSH Server
        shell: bash
        run: |
          set -e

          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends openssh-server

          sudo mkdir -p /run/sshd
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: 2. Create SSH User
        shell: bash
        run: |
          set -e

          sudo useradd -m -s /bin/bash testuser || true

          echo 'testuser:P@ssw0rd1qazXSW@#' | sudo chpasswd

          sudo mkdir -p /home/testuser/.ssh
          sudo chown -R testuser:testuser /home/testuser

          echo "PasswordAuthentication yes" | \
            sudo tee /etc/ssh/sshd_config.d/99-password.conf

          echo "PubkeyAuthentication no" | \
            sudo tee -a /etc/ssh/sshd_config.d/99-password.conf

          echo "PermitRootLogin no" | \
            sudo tee -a /etc/ssh/sshd_config.d/99-password.conf

          echo "AllowUsers testuser" | \
            sudo tee -a /etc/ssh/sshd_config.d/99-password.conf

          sudo sshd -t
          sudo systemctl restart ssh

      - name: 3. Install TCP Tunnel
        shell: bash
        run: |
          set -e

          curl -fsSL \
            https://raw.githubusercontent.com/ekzhang/bore/master/install.sh \
            | bash

          bore --version

      - name: 4. Start Public SSH Tunnel
        shell: bash
        run: |
          set -e

          nohup bore local 22 --to bore.pub \
            > /tmp/bore.log 2>&1 &

          sleep 8

          cat /tmp/bore.log

          PUBLIC_PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log \
            | head -n 1 \
            | cut -d: -f2)

          if [ -z "$PUBLIC_PORT" ]; then
            echo "ERROR: Public tunnel was not created."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "      PUBLIC SSH SERVER READY"
          echo "=============================================="
          echo ""
          echo "Host     : bore.pub"
          echo "Port     : $PUBLIC_PORT"
          echo "Username : testuser"
          echo "Password : P@ssw0rd1qazXSW@#"
          echo ""
          echo "SSH COMMAND:"
          echo "ssh -p $PUBLIC_PORT testuser@bore.pub"
          echo ""
          echo "=============================================="

      - name: 5. Verify SSH
        shell: bash
        run: |
          set -e

          echo "Checking SSH..."

          if sudo systemctl is-active --quiet ssh; then
            echo "SSH: ONLINE"
          else
            echo "SSH: FAILED"
            exit 1
          fi

          if timeout 5 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null; then
            echo "PORT 22: OPEN"
          else
            echo "PORT 22: FAILED"
            exit 1
          fi

      - name: 6. Keep Server Alive
        shell: bash
        run: |
          echo "=============================================="
          echo "SERVER ONLINE"
          echo "Maximum lifetime: 6 hours"
          echo "=============================================="

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] SSH SERVER ONLINE"
            sleep 60
          done
