name: Linux Cloud SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Prepare SSH
        shell: bash
        run: |
          set -e

          echo "Checking SSH installation..."

          if command -v sshd >/dev/null 2>&1; then
            echo "OpenSSH Server already installed."
          else
            echo "Installing OpenSSH Server..."
            sudo apt-get update -o Acquire::Retries=5
            sudo apt-get install -y --no-install-recommends openssh-server
          fi

          sudo mkdir -p /run/sshd

          echo "SSH installation check:"
          sshd -V 2>&1 || true

      - name: 2. Configure Root Account
        shell: bash
        run: |
          set -e

          echo "Configuring root account..."

          echo 'root:P@ssw0rd1qazXSW@#' | sudo chpasswd

          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-root-access.conf > /dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          EOF

          echo "Testing SSH configuration..."

          sudo sshd -t

          echo "SSH configuration OK."

      - name: 3. Start SSH
        shell: bash
        run: |
          set -e

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sleep 3

          if sudo systemctl is-active --quiet ssh; then
            echo "SSH SERVER: ONLINE"
          else
            echo "SSH SERVER: FAILED"
            sudo systemctl status ssh --no-pager || true
            exit 1
          fi

          echo "Listening ports:"
          sudo ss -lntp | grep ':22' || true

      - name: 4. Install Tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          if command -v tailscale >/dev/null 2>&1; then
            echo "Tailscale already installed."
          else
            echo "Installing Tailscale..."
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          echo "Starting Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-ssh"

          sleep 5

          if sudo tailscale status >/dev/null 2>&1; then
            echo "TAILSCALE: ONLINE"
          else
            echo "TAILSCALE: FAILED"
            sudo tailscale status || true
            exit 1
          fi

      - name: 5. Verify Server
        shell: bash
        run: |
          set -e

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IPv4 address not found."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "        LINUX SSH SERVER IS READY"
          echo "=============================================="
          echo ""
          echo "Tailscale IP : $TS_IP"
          echo "SSH Port     : 22"
          echo "Username     : root"
          echo "Password     : P@ssw0rd1qazXSW@#"
          echo ""
          echo "SSH Command:"
          echo "ssh root@$TS_IP"
          echo ""
          echo "=============================================="

          echo "Testing local SSH port..."

          if timeout 5 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null; then
            echo "SSH PORT 22: OPEN"
          else
            echo "SSH PORT 22: NOT ACCESSIBLE"
            exit 1
          fi

      - name: 6. Keep Server Online
        shell: bash
        run: |
          echo "=============================================="
          echo "SERVER IS ONLINE"
          echo "Waiting..."
          echo "=============================================="

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] SSH + Tailscale: ONLINE"
            sleep 60
          done
