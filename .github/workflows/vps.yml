name: Ultimate Developer VPS with Hardware Specs
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # استفاده از نسخه پایدار مشخص برای جلوگیری از اختلالات تغییرات سیستم‌عامل گیت‌هاب
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Programming & Python Dependencies
      run: |
        # حل مشکل قفل مخازن و خطای خروجی ۱۰۰ با نادیده گرفتن خطاهای جزیی آپدیت
        sudo apt-get update || true
        sudo apt-get install -y python3 python3-pip python3-venv git curl wget build-essential libssl-dev
        
        # نصب لوکال‌تانل به شیوه ایمن‌تر
        sudo apt-get install -y nodejs npm || true
        sudo npm install -g localtunnel || true
        
        # آپدیت پپ پایتون
        python3 -m pip install --upgrade pip --break-system-packages || true

    - name: Set Custom SSH Password
      run: |
        # تنظیم رمز عبور ایمن‌تر برای یوزر runner
        echo "runner:DeveloperPass2026!" | sudo chpasswd

    - name: Gather and Print VPS Detailed Specifications
      run: |
        echo "=========================================================="
        echo "               DETAILED VPS SPECIFICATIONS                "
        echo "=========================================================="
        echo "Operating System: $(lsb_release -ds)"
        echo "CPU Model:        $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"
        echo "CPU Cores:        $(nproc) Cores"
        echo "Total RAM:        $(free -h | grep Mem | awk '{print $2}')"
        echo "Disk Space:       $(df -h / | awk 'NR==2 {print $2 " Total (Free: " $4 ")"}')"
        echo "Public IP:        $(curl -s https://ipify.org || echo 'Not Found')"
        echo "----------------------------------------------------------"
        echo "                  SSH LOGIN CREDENTIALS                   "
        echo "----------------------------------------------------------"
        echo "Username:         runner"
        echo "Password:         DeveloperPass2026!"
        echo "=========================================================="

    - name: Launch VPS & Enable SSH Connection
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 350
