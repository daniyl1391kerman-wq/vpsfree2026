name: Linux Cloud SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: 2. Install OpenSSH Server
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: 3. Configure Root SSH Access
        run: |
          sudo passwd root <<EOF
          P@ssw0rd1qazXSW@#
          P@ssw0rd1qazXSW@#
          EOF

          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

          sudo systemctl restart ssh

      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-ssh"

          sleep 10

      - name: 5. Show SSH Information
        run: |
          echo "===================================================="
          echo "        LINUX SSH SERVER IS READY"
          echo "===================================================="

          echo "Tailscale IPv4:"
          sudo tailscale ip -4

          echo ""
          echo "Username: root"
          echo "Password: P@ssw0rd1qazXSW@#"
          echo ""
          echo "SSH Port: 22"

          echo "===================================================="

      - name: 6. Keep Server Alive
        run: |
          echo "Server will remain online until the GitHub job timeout."
          while true; do
            echo "[$(date)] SSH server is running..."
            sleep 60
          done
