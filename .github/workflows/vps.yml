name: Super Fast Python VPS
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # استفاده از آخرین نسخه برای حداکثر سرعت در استارت
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fast Install Python & PIP
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 python3-pip python3-venv wget curl
        python3 -m pip install --upgrade pip --break-system-packages || true

    - name: Set SSH Password
      run: |
        # تنظیم رمز عبور برای یوزر runner
        echo "runner:DeveloperPass2026!" | sudo chpasswd

    - name: Get Public IP & Show Credentials
      run: |
        echo "=========================================================="
        echo "              VPS SUCCESSFUL STARTUP INFO                 "
        echo "=========================================================="
        echo "Python Version:  $(python3 --version)"
        echo "Public IP:       $(curl -s https://ifconfig.me || curl -s https://ipinfo.io || echo 'Check inside server')"
        echo "Username:        runner"
        echo "Password:        DeveloperPass2026!"
        echo "=========================================================="

    - name: Launch VPS & Enable SSH Connection
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 350
