name: Linux Cloud SSH - Tailscale Public Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Install SSH
        shell: bash
        run: |
          set -e

          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends openssh-server

          sudo mkdir -p /run/sshd

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl is-active --quiet ssh

          echo "SSH SERVER: ONLINE"

      - name: 2. Create SSH User
        shell: bash
        run: |
          set -e

          sudo useradd -m -s /bin/bash testuser 2>/dev/null || true

          echo 'testuser:P@ssw0rd1qazXSW@#' | sudo chpasswd

          sudo mkdir -p /home/testuser/.ssh
          sudo chown -R testuser:testuser /home/testuser/.ssh
          sudo chmod 700 /home/testuser/.ssh

          sudo tee /etc/ssh/sshd_config.d/99-temporary.conf > /dev/null <<'EOF'
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication no
          PermitRootLogin no
          AllowUsers testuser
          EOF

          sudo sshd -t
          sudo systemctl restart ssh

          echo "SSH CONFIGURATION: OK"

      - name: 3. Install Tailscale
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-ssh"

          sleep 5

          sudo tailscale status

          echo "TAILSCALE: ONLINE"

      - name: 4. Enable Public SSH Funnel
        shell: bash
        run: |
          set -e

          echo "Starting Tailscale Funnel TCP tunnel..."

          sudo tailscale funnel \
            --tcp=10000 \
            tcp://127.0.0.1:22 \
            --yes \
            --bg

          sleep 5

          echo ""
          echo "Funnel status:"
          sudo tailscale funnel status

      - name: 5. Show Public SSH Address
        shell: bash
        run: |
          set -e

          HOSTNAME=$(sudo tailscale status --json | \
            python3 -c '
          import sys,json
          d=json.load(sys.stdin)
          print(d["Self"]["DNSName"].rstrip("."))
          ')

          TS_IP=$(sudo tailscale ip -4 | head -n 1)

          echo ""
          echo "======================================================"
          echo "        LINUX SSH SERVER IS READY"
          echo "======================================================"
          echo ""
          echo "Tailscale IP : $TS_IP"
          echo "Public Host  : $HOSTNAME"
          echo "Public Port  : 10000"
          echo ""
          echo "Username     : testuser"
          echo "Password     : P@ssw0rd1qazXSW@#"
          echo ""
          echo "PUBLIC SSH COMMAND:"
          echo "ssh -p 10000 testuser@$HOSTNAME"
          echo ""
          echo "======================================================"
          echo ""
          echo "Tailscale is only used by the server."
          echo "The SSH client does NOT need Tailscale."
          echo ""
          echo "Maximum lifetime: 6 hours."

      - name: 6. Verify SSH
        shell: bash
        run: |
          set -e

          echo "Checking local SSH..."

          if timeout 5 bash -c '</dev/tcp/127.0.0.1/22' 2>/dev/null; then
            echo "LOCAL SSH PORT 22: OPEN"
          else
            echo "LOCAL SSH PORT 22: FAILED"
            exit 1
          fi

          echo ""
          echo "Checking Tailscale Funnel..."

          sudo tailscale funnel status

          echo ""
          echo "SERVER STATUS: ONLINE"

      - name: 7. Keep Server Alive
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "SERVER IS RUNNING"
          echo "======================================================"

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] SSH + Tailscale Funnel: ONLINE"
            sleep 60
          done
